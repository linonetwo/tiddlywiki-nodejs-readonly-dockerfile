name: Build and Push to Harbor

on:
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "tests/**"
      - ".forgejo/workflows/build.yaml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Test entrypoint
        run: sh tests/entrypoint.test.sh
      - name: Build and push
        env:
          HARBOR_USER: 'robot$ci-push'
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -eu
          if [ -x /opt/kaniko/executor ]; then KANIKO_BIN=/opt/kaniko/executor
          elif [ -x /kaniko/executor ]; then KANIKO_BIN=/kaniko/executor
          else echo "kaniko missing"; exit 1; fi
          [ -z "${HARBOR_PASSWORD:-}" ] && echo "HARBOR_PASSWORD empty" && exit 1
          if decoded=$(printf '%s' "${HARBOR_PASSWORD}" | base64 -d 2>/dev/null); then
            HARBOR_PASSWORD="${decoded}"
          fi
          mkdir -p /kaniko/.docker
          AUTH=$(printf '%s' "${HARBOR_USER}:${HARBOR_PASSWORD}" | base64 | tr -d '\n')
          export DOCKER_CONFIG=/kaniko/.docker
          printf '{"auths":{"harbor.k3s.onetwo.website":{"auth":"%s"}}}\n' "${AUTH}" > "${DOCKER_CONFIG}/config.json"
          SHORT_SHA=$(echo "${FORGEJO_SHA:-${GITHUB_SHA:-unknown}}" | cut -c1-7)
          TAG=sha-${SHORT_SHA}
          "${KANIKO_BIN}" \
            --context="${GITHUB_WORKSPACE:-$PWD}" \
            --dockerfile=Dockerfile \
            --destination="harbor.k3s.onetwo.website/library/tiddlywiki-nodejs-readonly:${TAG}" \
            --cache=true --cache-repo="harbor.k3s.onetwo.website/library/cache" \
            --skip-tls-verify \
            --image-download-retry=5 \
            --registry-map=index.docker.io=harbor.k3s.onetwo.website/docker-io \
            --registry-map=ghcr.io=harbor.k3s.onetwo.website/ghcr-io \
            --cleanup --verbosity=info
          echo "Pushed version: ${TAG}"
