name: Build and Push to Harbor

# Trigger: push to master changes Dockerfile/entrypoint/this workflow, or manual dispatch
on:
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - ".forgejo/workflows/build.yaml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: docker
    steps:
      - name: Build and push to Harbor
        run: |
          set -e
          VERSION=$(date +%Y%m%d-%H%M%S)
          echo "Building version $VERSION"
          docker build -t harbor.k3s.onetwo.website/library/tiddlywiki-nodejs-readonly:$VERSION .
          docker tag harbor.k3s.onetwo.website/library/tiddlywiki-nodejs-readonly:$VERSION harbor.k3s.onetwo.website/library/tiddlywiki-nodejs-readonly:latest
          docker push harbor.k3s.onetwo.website/library/tiddlywiki-nodejs-readonly:$VERSION
          docker push harbor.k3s.onetwo.website/library/tiddlywiki-nodejs-readonly:latest
          echo "Pushed version: $VERSION"
