name: Build and Push to Harbor

on:
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - ".forgejo/workflows/build.yaml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: docker
    steps:
      - name: Debug env
        run: |
          echo "=== Environment ==="
          echo "HARBOR_USER=$HARBOR_USER"
          echo "Workspace: $(pwd)"
          echo "Files:"
          ls -la
          echo "Kaniko:"
          ls -la /kaniko/executor 2>&1
          echo "Shell:"
          readlink /proc/$$/exe 2>/dev/null || echo "/bin/sh"
          echo "base64 check:"
          which base64 2>&1 || which openssl 2>&1 || echo "no base64 found"
          echo "=== Done ==="
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push with Kaniko
        run: |
          VERSION=$(date +%Y%m%d-%H%M%S)
          echo "Building version $VERSION"
          mkdir -p /kaniko/.docker
          AUTH=$(printf "%s:%s" "$HARBOR_USER" "$HARBOR_PASSWORD" | openssl base64 -A 2>/dev/null || printf "%s:%s" "$HARBOR_USER" "$HARBOR_PASSWORD" | base64 2>/dev/null)
          printf '{"auths":{"harbor.k3s.onetwo.website":{"auth":"%s"}}}\n' "$AUTH" > /kaniko/.docker/config.json
          /kaniko/executor \
            --context dir:///workspace/lindongwu/tiddlywiki-nodejs-readonly-dockerfile \
            --dockerfile Dockerfile \
            --destination "harbor.k3s.onetwo.website/library/tiddlywiki-nodejs-readonly:$VERSION" \
            --destination harbor.k3s.onetwo.website/library/tiddlywiki-nodejs-readonly:latest \
            --registry-mirror=harbor-docker-io.k3s.onetwo.website \
            --cache=true \
            --cache-repo=harbor.k3s.onetwo.website/library/tiddlywiki-nodejs-readonly-cache \
            --cache-copy-layers \
            --cleanup \
            --verbosity=info
          echo "Pushed version: $VERSION"
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
