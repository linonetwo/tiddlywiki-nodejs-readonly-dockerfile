name: Build and Push to Harbor

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: docker
    steps:
      - run: |
          echo "step1: checking script"
          ls -la kaniko-build.sh
          chmod +x kaniko-build.sh
          echo "step2: running script"
          ./kaniko-build.sh
          echo "step3: done"
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
