name: Build and Push to Harbor

on:
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - ".forgejo/workflows/build.yaml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: docker
    steps:
      - run: |
          echo "USER=$HARBOR_USER"
          echo "PWD_LEN=${#HARBOR_PASSWORD}"
          echo "pwd=$(pwd)"
          ls -la kaniko-build.sh
          chmod +x kaniko-build.sh
          ./kaniko-build.sh
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
